name: CI

# The checks that otherwise only run locally: `bun run check`, the web tests, pytest, the live
# Postgres contract suite and the production-build PWA matrix in Chromium (job `pwa-matrix`), plus
# a secret scan of the whole history (job `secrets`). The Bun and uv versions follow package.json `packageManager`
# (bun@1.4.0), deploy/docker/Dockerfile.web (oven/bun:1.4.0, node:24) and
# deploy/docker/Dockerfile.api (uv 0.11.17). Python comes from .python-version (3.14), which uv
# downloads on demand.
#
# Dependencies are installed with the frozen lockfiles instead of `bun run install-all`:
# tools/install.sh regenerates the API client, which would make the drift gate of
# `bun run check` (tools/gen-types.sh --check) pass on a stale client.
#
# Actions are pinned to full commit SHAs (tag in the comment): a moved tag cannot run other code.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.0"
  UV_VERSION: "0.11.17"
  NODE_VERSION: "24"

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python dependencies
        run: bash tools/uv.sh sync --all-packages --frozen
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Build and check (includes the generated API client drift gate)
        run: bun run check

  web-test:
    name: Web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Run web tests
        run: bunx nx run web:test

  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python dependencies
        run: bash tools/uv.sh sync --all-packages --frozen
      # Covers every Python test directory, including packages/py/cli and packages/py/utils, which
      # no Nx `test` target runs. The live-Postgres suites skip here (RUN_PG_CONTRACT is unset).
      - name: Run pytest
        run: bash tools/uv.sh run --no-sync pytest tests apps/api/tests packages/py -q

  pg-contract:
    name: Postgres contract suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Without RUN_PG_CONTRACT every suite skips and the job would pass without testing anything.
      RUN_PG_CONTRACT: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python dependencies
        run: bash tools/uv.sh sync --all-packages --frozen
      # Same command as `bunx nx run db:test-pg-contract` (packages/py/db/project.json), without
      # needing Bun and Node for it. The suites create and drop throwaway databases, so the role
      # needs CREATEDB; the image's superuser has it.
      - name: Run Postgres contract suites
        run: bash tools/db.sh test-pg-contract

  # tests/pwa_matrix.cjs against the production build in headless Chromium, with a synthetic API:
  # installability, worker registration and claim, standalone start, deep links, viewports, the
  # v1 -> v2 update with stale-chunk recovery, and offline navigation. Playwright is pinned and
  # installed outside the workspace (no install scripts), so the lockfiles stay unchanged. Safari
  # and iOS are not covered here; the iPhone check stays a manual acceptance step (#98).
  pwa-matrix:
    name: PWA matrix (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: "1.61.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Build the web app
        run: bunx nx run web:build
      - name: Install pinned Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --prefix "${RUNNER_TEMP}/playwright" --no-save --no-package-lock --ignore-scripts \
            "playwright@${PLAYWRIGHT_VERSION}"
          "${RUNNER_TEMP}/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run the PWA matrix
        run: NODE_PATH="${RUNNER_TEMP}/playwright/node_modules" node tests/pwa_matrix.cjs

  # gitleaks over the whole history, every branch and tag, with the rules in .gitleaks.toml.
  # The binary is downloaded from the release page and checked against its SHA-256 before it runs.
  # .gitleaksignore must stay empty and `gitleaks:allow` comments do not count: a real finding is
  # rotated, never silenced by fingerprint or inline comment.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified gitleaks and scan the history
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$RUNNER_TEMP" gitleaks
          test ! -s .gitleaksignore
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --ignore-gitleaks-allow --log-opts="--all" --config .gitleaks.toml .
